[project]
name = "bird-sql"
version = "0.1.1"
description = "BIRD text-to-SQL: execution-match reward with error and reward-hacking metrics."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bird_sql"]
